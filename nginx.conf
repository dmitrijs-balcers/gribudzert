server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/manifest+json image/svg+xml;

    # Security headers.
    # NOTE: nginx's add_header is NOT inherited by a location that declares its own
    # add_header, so every location below that adds a header repeats this full set.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; connect-src 'self' https://overpass-api.de https://api-gateway.umami.dev https://cloud.umami.is; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; frame-ancestors 'self'" always;

    # Hashed static assets: cache for a year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; connect-src 'self' https://overpass-api.de https://api-gateway.umami.dev https://cloud.umami.is; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; frame-ancestors 'self'" always;
    }

    # index.html must never be served stale, otherwise deploys do not propagate
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; connect-src 'self' https://overpass-api.de https://api-gateway.umami.dev https://cloud.umami.is; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; frame-ancestors 'self'" always;
    }

    # SPA fallback - serve index.html for all routes (inherits the server-level headers)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Coolify (no add_header here, so server headers are inherited)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
