<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Gribudzert – drinking water &amp; public toilets map</title>
        <meta
            name="description"
            content="Find free drinking water taps and public toilets near you on an interactive OpenStreetMap-based map."
        />
        <meta name="theme-color" content="#0078ff" />
        <!-- Translucent status bar in iOS standalone mode so map tiles render under the notch -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Gribudzert" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <link rel="manifest" href="manifest.json" />

        <!-- Umami analytics: stripped by vite.config.ts unless building in production mode -->
        <script
            defer
            data-analytics="umami"
            src="https://cloud.umami.is/script.js"
            data-website-id="%VITE_UMAMI_WEBSITE_ID%"
            data-do-not-track="true"
        ></script>

        <style>
            /*
             * Safe-area insets (notch, home indicator, rounded corners).
             * Resolve to 0 on devices without them. Requires viewport-fit=cover.
             */
            :root {
                --safe-top: env(safe-area-inset-top, 0px);
                --safe-right: env(safe-area-inset-right, 0px);
                --safe-bottom: env(safe-area-inset-bottom, 0px);
                --safe-left: env(safe-area-inset-left, 0px);
            }

            html,
            body {
                height: 100%;
                margin: 0;
                /* Stop rubber-band / pull-to-refresh from moving the map page */
                overscroll-behavior: none;
                overflow: hidden;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    Arial;
                background: #f7f7f7;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /*
             * Map fills the whole screen edge to edge, including under the
             * notch and home indicator. position:fixed + inset:0 tracks the
             * real visual viewport on iOS (100vh does not shrink for the
             * Safari toolbar). Tiles go under the notch; controls are padded
             * out of it below.
             */
            #map {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                /* A double tap zooms; it must never select the word under the finger. */
                -webkit-user-select: none;
                user-select: none;
            }

            #map .leaflet-popup-content {
                -webkit-user-select: text;
                user-select: text;
            }

            /*
             * Push Leaflet's corner control containers out of the safe areas.
             * Scoped to #map so these beat leaflet.css, which Vite injects later.
             */
            #map .leaflet-top {
                top: var(--safe-top);
            }
            #map .leaflet-bottom {
                bottom: var(--safe-bottom);
            }
            #map .leaflet-left {
                left: var(--safe-left);
            }
            #map .leaflet-right {
                right: var(--safe-right);
            }

            .info {
                position: absolute;
                bottom: calc(12px + var(--safe-bottom));
                right: calc(12px + var(--safe-right));
                z-index: var(--z-hud);
                background: var(--surface-pill);
                padding: 8px 12px;
                border-radius: 6px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
                font-size: var(--font-size-md);
                line-height: 1.2;
                opacity: 0.9;
            }

            .info a {
                color: var(--color-brand);
                text-decoration: none;
            }

            /* Adjust default leafet control button appearance */
            .leaflet-bar a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 34px;
                height: 34px;
                font-size: 18px;
            }

            /* Make layer control less obtrusive on small screens */
            @media (max-width: 600px) {
                .info {
                    display: none;
                }
            }

            /* Popup action styles (directions, guide me) - prominent & accessible */
            .leaflet-popup-content-wrapper {
                font-size: 14px;
            }

            .popup-actions {
                margin-top: 8px;
                display: flex;
                gap: 8px;
                align-items: center;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .navigate-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                box-sizing: border-box;
                padding: 8px 10px;
                border-radius: 8px;
                border: 0;
                background: linear-gradient(180deg, var(--color-brand), #0063d1);
                color: white;
                box-shadow: 0 3px 8px rgba(3, 102, 214, 0.2);
                font: inherit;
                font-weight: 600;
                text-decoration: none;
                cursor: pointer;
                transition:
                    transform 120ms ease,
                    box-shadow 120ms ease,
                    opacity 120ms ease;
                -webkit-tap-highlight-color: transparent;
            }

            /* Outranks Leaflet's ".leaflet-container a" link colour */
            .leaflet-container a.navigate-btn {
                color: white;
            }

            .navigate-btn:active {
                transform: translateY(1px) scale(0.995);
            }

            .navigate-btn:focus {
                outline: 3px solid rgba(0, 120, 255, 0.25);
                outline-offset: 2px;
            }

            .navigate-btn .icon {
                display: inline-block;
                width: 18px;
                height: 18px;
                line-height: 18px;
                text-align: center;
                font-size: 14px;
            }

            /* Secondary action styles (OpenStreetMap link) kept minimal */
            .popup-secondary {
                background: transparent;
                border: none;
                color: var(--color-brand);
                text-decoration: underline;
                font-size: 13px;
                cursor: pointer;
                padding: 0;
            }

            /* Make popups more comfortable on small screens */
            @media (max-width: 420px) {
                .navigate-btn {
                    width: 100%;
                    justify-content: center;
                }
                .popup-actions {
                    flex-direction: column;
                    align-items: stretch;
                }
            }

            /* Loading Overlay Styles */
            .loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none;
            }

            .loading-overlay.loading-visible {
                opacity: 1;
                pointer-events: auto;
            }

            .loading-spinner {
                background: white;
                padding: 24px 32px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(0, 120, 255, 0.2);
                border-top-color: var(--color-brand);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .loading-text {
                font-size: 14px;
                color: var(--color-text-muted);
                font-weight: 500;
            }

            /* Reduced motion preferences */
            @media (prefers-reduced-motion: reduce) {
                .spinner {
                    animation: none;
                    border-top-color: var(--color-brand);
                    opacity: 0.6;
                }

                .loading-overlay {
                    transition: none;
                }
            }

            /*
             * Splash: JS-free so it paints before any script arrives on a slow
             * network. Animates only transform and opacity (compositor-only).
             * src/ui/splash.ts fades it out via .splash-hidden and removes it.
             */
            #splash {
                position: fixed;
                inset: 0;
                z-index: 2000; /* above Leaflet (<= 1000) */
                display: flex;
                align-items: center;
                justify-content: center;
                padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
                background:
                    radial-gradient(circle at 50% 45%, rgba(0, 120, 255, 0.08), rgba(0, 120, 255, 0) 38vmax),
                    #f7f7f7;
                color: var(--color-text);
                text-align: center;
                -webkit-user-select: none;
                user-select: none;
                transition: opacity 350ms ease-out;
            }

            .splash-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                transition: transform 350ms ease-out;
            }

            #splash.splash-hidden {
                opacity: 0;
                pointer-events: none;
            }
            #splash.splash-hidden .splash-content {
                transform: scale(1.04);
            }

            /* Drop and rings share one 3s loop: fall 0.18–0.78s, impact at 0.78s */
            .splash-glyph {
                --splash-loop: 3s;
                --splash-impact: 0.78s;
                position: relative;
                width: 96px;
                height: 96px;
                margin-bottom: 22px;
            }
            .splash-glyph svg {
                position: relative;
                display: block;
                width: 100%;
                height: 100%;
                opacity: 0;
                transform-origin: 50% 95%;
                animation: splash-drop var(--splash-loop) infinite;
            }

            /* Flattened rings at the contact point, staggered after impact */
            .splash-ring {
                position: absolute;
                left: -12px;
                bottom: -16px;
                width: 120px;
                height: 40px;
                border-radius: 50%;
                border: 2px solid rgba(0, 120, 255, 0.75);
                opacity: 0;
                transform: scale(0.2);
                animation: splash-ripple var(--splash-loop) ease-out var(--splash-impact) infinite;
            }
            .splash-ring:nth-child(2) {
                border-width: 1.5px;
                border-color: rgba(0, 120, 255, 0.55);
                animation-delay: calc(var(--splash-impact) + 0.18s);
            }
            .splash-ring:nth-child(3) {
                border-width: 1px;
                border-color: rgba(0, 120, 255, 0.4);
                animation-delay: calc(var(--splash-impact) + 0.36s);
            }

            .splash-title {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 0.01em;
            }
            .splash-hint {
                margin: 6px 0 0;
                font-size: 14px;
                color: #6b6b6b;
            }
            .splash-slow {
                margin-top: 18px;
                font-size: var(--font-size-md);
                color: #8a8a8a;
                opacity: 0;
                animation: splash-reveal 600ms ease-out 6s forwards;
            }

            /* Appear → gravity fall → squash → springy settle → rest → fade */
            @keyframes splash-drop {
                0% { transform: translateY(-44px) scale(0.92, 1.12); opacity: 0; animation-timing-function: ease-out; }
                6% { transform: translateY(-40px) scale(0.92, 1.12); opacity: 1; animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
                26% { transform: translateY(0) scale(0.92, 1.12); animation-timing-function: ease-out; }
                28% { transform: translateY(0) scale(1.18, 0.82); animation-timing-function: ease-in-out; }
                31% { transform: translateY(0) scale(0.94, 1.06); animation-timing-function: ease-in-out; }
                34% { transform: translateY(0) scale(1.03, 0.98); animation-timing-function: ease-out; }
                36%, 82% { transform: translateY(0) scale(1); opacity: 1; }
                92% { transform: translateY(0) scale(1); opacity: 0; }
                100% { transform: translateY(-44px) scale(0.92, 1.12); opacity: 0; }
            }
            @keyframes splash-ripple {
                0% { transform: scale(0.2); opacity: 1; }
                20% { transform: scale(0.8); opacity: 0.7; }
                40%, 100% { transform: scale(1.1); opacity: 0; }
            }
            @keyframes splash-reveal {
                to { opacity: 1; }
            }

            /* Reduced motion: static drop at rest, no rings, opacity fades only */
            @media (prefers-reduced-motion: reduce) {
                .splash-glyph svg {
                    animation: none;
                    opacity: 1;
                }
                .splash-ring {
                    animation: none;
                }
                .splash-content {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <div
            id="splash"
            role="status"
            aria-live="polite"
            aria-label="Loading Gribudzert"
        >
            <div class="splash-content">
                <div class="splash-glyph">
                    <span class="splash-ring" aria-hidden="true"></span>
                    <span class="splash-ring" aria-hidden="true"></span>
                    <span class="splash-ring" aria-hidden="true"></span>
                    <!-- Drop from public/icons/icon.svg -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="136 99 240 272"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path
                            d="M256 112c-44 62-88 106-88 158a88 88 0 0 0 176 0c0-52-44-96-88-158z"
                            fill="#0078ff"
                        />
                        <path
                            d="M220 278a36 36 0 0 0 36 36"
                            fill="none"
                            stroke="#ffffff"
                            stroke-width="14"
                            stroke-linecap="round"
                            opacity="0.9"
                        />
                    </svg>
                </div>
                <p class="splash-title">Gribudzert</p>
                <p class="splash-hint">Loading map…</p>
                <p class="splash-slow">Slow connection… still loading</p>
            </div>
        </div>

        <div id="map" aria-label="Map centered on Riga"></div>

        <div class="info" aria-hidden="true">
            Tiles: OpenStreetMap • Map engine: Leaflet<br />
            <a
                href="https://www.openstreetmap.org"
                target="_blank"
                rel="noreferrer"
                >openstreetmap.org</a
            >
        </div>

        <noscript>
            <div style="padding: 1rem; text-align: center">
                JavaScript is required to display the map. Please enable
                JavaScript in your browser.
            </div>
        </noscript>

        <script type="module" src="./src/index.ts"></script>
    </body>
</html>
